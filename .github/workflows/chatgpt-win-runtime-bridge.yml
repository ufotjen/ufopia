name: ChatGPT Windows runtime bridge

on:
  push:
    branches:
      - chatgpt-toolchain-bridge
    paths:
      - .github/workflows/chatgpt-win-runtime-bridge.yml

jobs:
  restore-win-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Restore Windows x64 runtime packs
        run: |
          mkdir -p probe
          cat > probe/probe.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net8.0</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>true</SelfContained>
            </PropertyGroup>
          </Project>
          EOF
          dotnet restore probe/probe.csproj -r win-x64

      - name: Copy runtime package cache
        run: |
          mkdir -p bridge/nuget
          cp -a ~/.nuget/packages/. bridge/nuget/
          du -sh bridge/nuget

      - name: Upload Windows runtime cache
        uses: actions/upload-artifact@v4
        with:
          name: ufopia-win-x64-runtime-cache-net8
          path: bridge/
          compression-level: 6
          retention-days: 1
          if-no-files-found: error
